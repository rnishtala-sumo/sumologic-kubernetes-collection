apiVersion: apps/v1
kind: Deployment
metadata:
  name: dogstatsd-sample-app
  namespace: default
  labels:
    app: dogstatsd-sample-app
    component: metrics-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dogstatsd-sample-app
  template:
    metadata:
      labels:
        app: dogstatsd-sample-app
        component: metrics-generator
      annotations:
        prometheus.io/scrape: "false"  # This app sends DogStatsD, not Prometheus metrics
    spec:
      containers:
      - name: dogstatsd-generator
        image: localhost:32000/dogstatsd-sample-app:latest
        imagePullPolicy: IfNotPresent  # Pull from local registry if not present
        env:
        # DogStatsD configuration - send to node-exporter with statsd sidecar
        - name: DOGSTATSD_HOST
          value: "sumo-prometheus-node-exporter.default.svc.cluster.local"  # Node exporter with statsd sidecar
        - name: DOGSTATSD_PORT
          value: "8125"
        
        # OTLP configuration (backup method)
        - name: OTLP_ENDPOINT
          value: "http://sumo-prometheus-otelcol-logs.default.svc.cluster.local:4318/v1/metrics"
        
        # Application configuration
        - name: APP_NAME
          value: "dogstatsd-sample-app"
        - name: METRIC_INTERVAL
          value: "10"  # Send metrics every 10 seconds
        
        # Kubernetes metadata for enrichment
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        
        # Health check using the app's internal logic
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(5); s.connect(('$DOGSTATSD_HOST', int('$DOGSTATSD_PORT'))); s.close()"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(5); s.connect(('$DOGSTATSD_HOST', int('$DOGSTATSD_PORT'))); s.close()"
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      
      restartPolicy: Always
      
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

---
apiVersion: v1
kind: Service
metadata:
  name: dogstatsd-sample-app
  namespace: default
  labels:
    app: dogstatsd-sample-app
spec:
  selector:
    app: dogstatsd-sample-app
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP